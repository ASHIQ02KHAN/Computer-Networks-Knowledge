# ============================================================
# GitHub Actions — Deploy Documentation to GitHub Pages
# Triggered on pushes to main that modify Markdown or config.
# ============================================================
name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "mkdocs.yml"
      - "javascripts/**"

permissions:
  contents: write   # Required for gh-deploy to push to gh-pages branch

jobs:
  deploy:
    name: Build & Deploy MkDocs Site
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout with full history (needed by git-revision-date plugin) ──
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up Python ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install MkDocs and plugins ────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            mkdocs-material \
            mkdocs-git-revision-date-localized-plugin \
            mkdocs-minify-plugin

      # ── 4. Prepare docs/ directory (MkDocs requires docs_dir != config dir) ──
      - name: Prepare docs directory
        run: |
          mkdir -p docs
          # Copy root markdown files
          cp README.md docs/ 2>/dev/null || true
          cp CONTRIBUTING.md docs/ 2>/dev/null || true
          # Copy all module directories
          for dir in 01-network-basics-and-architecture \
                     02-network-security-fundamentals \
                     03-application-layer-and-protocols \
                     04-transport-layer-and-reliability \
                     05-network-layer-and-routing \
                     06-data-link-layer-and-lan \
                     07-master-cheat-sheets-and-formulas; do
            cp -r "$dir" docs/ 2>/dev/null || true
          done
          # Copy JavaScript assets for KaTeX
          mkdir -p docs/javascripts
          cp javascripts/katex-init.js docs/javascripts/ 2>/dev/null || true

      # ── 5. Deploy to GitHub Pages (gh-pages branch) ──────────────────────────
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force

# ============================================================
# GitHub Actions — Deploy Documentation to GitHub Pages
# Triggered on pushes to main that modify Markdown or config.
# ============================================================
name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "mkdocs.yml"

permissions:
  contents: write   # Required for gh-deploy to push to gh-pages branch

jobs:
  deploy:
    name: Build & Deploy MkDocs Site
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout with full history (needed by git-revision-date plugin) ──
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up Python ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install MkDocs and plugins ────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            mkdocs-material \
            mkdocs-git-revision-date-localized-plugin \
            mkdocs-minify-plugin

      # ── 4. Deploy to GitHub Pages (gh-pages branch) ──────────────────────────
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
